<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brief Creativo Interactivo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0b0f19, #131130);
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* Cajas de texto de alta visibilidad */
        .input-premium {
            background: rgba(255, 255, 255, 0.07) !important;
            border: 2px solid rgba(99, 102, 241, 0.4) !important;
            color: #ffffff !important;
            font-size: 0.95rem;
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            transition: all 0.25s ease;
        }
        .input-premium:focus {
            background: rgba(255, 255, 255, 0.12) !important;
            border-color: #818cf8 !important;
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.3);
            outline: none;
        }
        /* Estilo claro para los textos de guía (Placeholders) */
        .input-premium::placeholder {
            color: rgba(255, 255, 255, 0.45) !important;
            font-style: italic;
        }
        /* Estilos limpios y puros para el motor de PDF */
        .pdf-print {
            background: #ffffff !important;
            color: #1e293b !important;
            padding: 30px !important;
        }
        .pdf-print .input-premium {
            background: #f8fafc !important;
            border: 1px solid #cbd5e1 !important;
            color: #0f172a !important;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen p-4 md:p-8 flex flex-col items-center">

    <div class="max-w-4xl w-full">
        
        <div class="glass-card rounded-3xl p-6 mb-6 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-2xl">
            <div>
                <h1 class="text-2xl font-black text-white tracking-tight">Formulario de Brief</h1>
                <p class="text-xs text-slate-400">Completa los campos guiándote por los ejemplos.</p>
            </div>
            <button onclick="generarPDFYWhatsApp()" class="w-full sm:w-auto bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-6 py-3.5 rounded-2xl flex items-center justify-center gap-2 transition-all transform active:scale-95 shadow-lg shadow-emerald-500/20 cursor-pointer">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.4.01 12.008.01c3.202.001 6.212 1.246 8.477 3.513 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.713-1.457L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.625 1.451 5.436 0 9.86-4.37 9.864-9.799.002-2.63-1.023-5.101-2.885-6.965C16.328 1.977 13.864 1.05 11.997 1.05c-5.444 0-9.866 4.372-9.87 9.802 0 1.514.404 2.99 1.17 4.305l-.994 3.629 3.734-.972zm11.233-5.334c-.267-.134-1.58-.779-1.825-.869-.244-.089-.423-.134-.599.134-.177.267-.684.869-.838 1.047-.154.177-.308.2-.575.066-.267-.134-1.127-.415-2.147-1.326-.792-.707-1.328-1.58-1.483-1.847-.154-.267-.017-.411.117-.544.121-.119.267-.311.4-.467.134-.156.178-.267.267-.445.089-.178.044-.334-.022-.467-.067-.134-.599-1.444-.821-1.978-.217-.522-.455-.451-.624-.46l-.532-.01c-.183 0-.481.069-.733.344-.252.276-.962.94-9.62 2.294 0 1.354.982 2.66 1.119 2.844.137.183 1.93 2.945 4.677 4.129.654.282 1.164.45 1.562.577.657.21 1.256.18 1.729.11.527-.078 1.58-.646 1.802-1.24.223-.593.223-1.101.156-1.21-.067-.107-.244-.176-.511-.311z"/></svg>
                Generar y Enviar
            </button>
        </div>

        <div id="brief-area" class="glass-card rounded-3xl p-6 md:p-10 shadow-2xl space-y-6">
            
            <div class="border-b border-slate-700/60 pb-4">
                <h2 class="text-xl font-bold text-white tracking-wide uppercase text-center sm:text-left">Estructura Estratégica del Brief</h2>
            </div>

            <div class="space-y-3">
                <h3 class="text-indigo-400 font-bold text-md flex items-center gap-2">🔹 1. Identificación de Marca</h3>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Nombre Comercial</label>
                    <input type="text" id="nombre" class="input-premium" placeholder="Ejemplo: TomyStyle">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Idea de Logotipo / Isotipo</label>
                    <input type="text" id="logo" class="input-premium" placeholder="Ejemplo: Logotipo circular minimalista con bordes redondeados">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Colores Corporativos (Mínimo 2)</label>
                    <input type="text" id="colores" class="input-premium" placeholder="Ejemplo: #0F172A (Negro Azulado) y #25D366 (Verde WhatsApp)">
                </div>
            </div>

            <div class="space-y-3">
                <h3 class="text-indigo-400 font-bold text-md flex items-center gap-2">🔹 2. Historia y Emociones</h3>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">¿Cómo nació y qué debe transmitir?</label>
                    <textarea id="historia" rows="3" class="input-premium" placeholder="Ejemplo: Nació para resolver la falta de ropa urbana con identidad startup. Debe evocar confianza, disrupción y alta calidad técnica."></textarea>
                </div>
            </div>

            <div class="space-y-3">
                <h3 class="text-indigo-400 font-bold text-md flex items-center gap-2">🔹 3. Tipo de Producto</h3>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">¿Qué productos específicos elaboran?</label>
                    <textarea id="producto" rows="3" class="input-premium" placeholder="Ejemplo: Poleras oversized y hoodies premium de algodón pesado con tipografías redondeadas de alta densidad."></textarea>
                </div>
            </div>

            <div class="space-y-3">
                <h3 class="text-indigo-400 font-bold text-md flex items-center gap-2">🔹 4. Nicho de Mercado y Público</h3>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Nicho y Perfil del Buyer Persona (Cliente ideal)</label>
                    <textarea id="nicho" rows="3" class="input-premium" placeholder="Ejemplo: Diseñadores, desarrolladores de software y apasionados de la tecnología de 20 a 35 años que aprecian la estética limpia."></textarea>
                </div>
            </div>

            <div class="space-y-3">
                <h3 class="text-indigo-400 font-bold text-md flex items-center gap-2">🔹 5. Propuesta de Valor</h3>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">¿Qué los hace únicos frente a otros?</label>
                    <textarea id="valor" rows="2" class="input-premium" placeholder="Ejemplo: No vendemos moda rápida; materializamos la cultura de la ingeniería en prendas físicas sofisticadas."></textarea>
                </div>
            </div>

            <div class="space-y-3">
                <h3 class="text-indigo-400 font-bold text-md flex items-center gap-2">🔹 6. Estrategia Publicitaria</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Medios donde sentar presencia</label>
                        <input type="text" id="medios" class="input-premium" placeholder="Ejemplo: Instagram y TikTok Ads">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Enlace de Red Social Activa</label>
                        <input type="url" id="enlace" class="input-premium" placeholder="Ejemplo: https://instagram.com/tu_marca">
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function generarPDFYWhatsApp() {
            const contenedor = document.getElementById('brief-area');
            
            // Transformación estética temporal para que el PDF salga impecable y contrastado en blanco
            contenedor.classList.add('pdf-print');
            
            const opciones = {
                margin:       [0.4, 0.4],
                filename:     `Brief_${document.getElementById('nombre').value || 'Marca'}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, logging: false, useCORS: true },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            // Ejecución del renderizado del PDF
            html2pdf().set(opciones).from(contenedor).save().then(() => {
                // Restaurar la visualización premium en modo oscuro original
                contenedor.classList.remove('pdf-print');

                const nombreMarca = document.getElementById('nombre').value || "Nueva Marca";
                const miNumero = "59177173169"; // Tu número exacto integrado
                
                // Formatear texto limpio para el envío directo a WhatsApp
                const mensaje = `🚀 *¡Brief Creativo Terminado!*\n\n• *Marca:* ${nombreMarca}\n• *Acción:* El PDF con todas las respuestas y ejemplos se ha descargado de manera local correctamente.`;
                
                const urlFinal = `https://api.whatsapp.com/send?phone=${miNumero}&text=${encodeURIComponent(mensaje)}`;
                
                // Redirección forzada segura
                window.open(urlFinal, '_blank');
            }).catch(err => {
                console.error("Error generando el PDF: ", err);
                // Si la descarga falla por permisos del navegador móvil, igual procesa la salida a WhatsApp
                const miNumero = "59177173169";
                const mensajeFallback = `🚀 *Notificación:* Formulario completado para la marca: ${document.getElementById('nombre').value || "Nueva Marca"}.`;
                window.open(`https://api.whatsapp.com/send?phone=${miNumero}&text=${encodeURIComponent(mensajeFallback)}`, '_blank');
            });
        }
    </script>
</body>
</html>
