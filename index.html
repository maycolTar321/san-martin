<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brief Creativo Profesional</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0b0c0d;
    color:white;
    font-family:'Plus Jakarta Sans',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

.bg-light{
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.15;
    z-index:0;
}

.bg1{
    background:#22c55e;
    top:-150px;
    left:-150px;
}

.bg2{
    background:#334155;
    bottom:-150px;
    right:-150px;
}

.glass{
    background:rgba(20,20,20,.7);
    border:1px solid rgba(255,255,255,.05);
    backdrop-filter:blur(20px);
}

.input{
    width:100%;
    background:#111315;
    border:1px solid #1f2937;
    padding:15px;
    border-radius:14px;
    color:white;
    outline:none;
    transition:.3s;
    font-size:14px;
}

.input:focus{
    border-color:#22c55e;
    box-shadow:0 0 0 3px rgba(34,197,94,.15);
}

.label{
    display:block;
    margin-bottom:8px;
    font-size:11px;
    text-transform:uppercase;
    color:#94a3b8;
    font-weight:700;
    letter-spacing:1px;
}

.section-title{
    font-size:15px;
    font-weight:700;
    margin-bottom:15px;
    color:white;
    display:flex;
    align-items:center;
    gap:10px;
}

.section-title::before{
    content:'';
    width:5px;
    height:18px;
    background:#22c55e;
    border-radius:20px;
}

.report-card{
    background:#111315;
    border:1px solid #1f2937;
    border-radius:16px;
    padding:18px;
}

.report-title{
    color:#22c55e;
    font-size:13px;
    font-weight:700;
    margin-bottom:10px;
    text-transform:uppercase;
}

.btn-green{
    background:#22c55e;
    color:black;
    font-weight:700;
}

.btn-dark{
    background:#1e293b;
    color:white;
}

button{
    border:none;
    padding:15px;
    border-radius:14px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
}

::-webkit-scrollbar{
    width:5px;
}

::-webkit-scrollbar-thumb{
    background:#22c55e;
    border-radius:20px;
}

</style>
</head>

<body>

<div class="bg-light bg1"></div>
<div class="bg-light bg2"></div>

<div class="relative z-10 max-w-5xl mx-auto p-4 md:p-8">

    <div class="glass rounded-3xl p-6 md:p-8 mb-6">

        <div class="flex flex-col md:flex-row gap-4 md:items-center md:justify-between">

            <div>
                <p class="text-green-400 text-xs uppercase tracking-[3px] font-bold">
                    Plataforma Profesional
                </p>

                <h1 class="text-3xl font-black mt-2">
                    Brief Creativo
                </h1>
            </div>

            <button
                id="generateBtn"
                class="btn-green px-8">
                Generar Reporte
            </button>

        </div>

    </div>

    <form id="briefForm" class="glass rounded-3xl p-6 md:p-10 space-y-10">

        <section>

            <h2 class="section-title">
                Identidad Visual
            </h2>

            <div class="grid md:grid-cols-2 gap-5">

                <div>
                    <label class="label">
                        Nombre Comercial
                    </label>

                    <input
                        type="text"
                        class="input"
                        id="name"
                        placeholder="Ej: MADA Studio">
                </div>

                <div>
                    <label class="label">
                        Logotipo
                    </label>

                    <input
                        type="text"
                        class="input"
                        id="logo"
                        placeholder="Describe el logo">
                </div>

                <div class="md:col-span-2">
                    <label class="label">
                        Colores Corporativos
                    </label>

                    <input
                        type="text"
                        class="input"
                        id="colors"
                        placeholder="#000000, #22c55e">
                </div>

            </div>

        </section>

        <section>

            <h2 class="section-title">
                Historia y ADN
            </h2>

            <div class="space-y-5">

                <div>
                    <label class="label">
                        Historia
                    </label>

                    <textarea
                        class="input min-h-[130px]"
                        id="history"
                        placeholder="Describe la historia de la marca"></textarea>
                </div>

                <div>
                    <label class="label">
                        Emociones
                    </label>

                    <textarea
                        class="input min-h-[120px]"
                        id="emotions"
                        placeholder="¿Qué emociones transmite?"></textarea>
                </div>

            </div>

        </section>

        <section>

            <h2 class="section-title">
                Producto
            </h2>

            <div class="space-y-5">

                <div>
                    <label class="label">
                        Productos
                    </label>

                    <textarea
                        class="input min-h-[120px]"
                        id="product"
                        placeholder="Describe los productos"></textarea>
                </div>

                <div>
                    <label class="label">
                        Diferenciadores
                    </label>

                    <textarea
                        class="input min-h-[120px]"
                        id="attributes"
                        placeholder="¿Qué hace único al producto?"></textarea>
                </div>

            </div>

        </section>

        <section>

            <h2 class="section-title">
                Cliente Ideal
            </h2>

            <div class="space-y-5">

                <div>
                    <label class="label">
                        Nicho
                    </label>

                    <textarea
                        class="input min-h-[100px]"
                        id="niche"
                        placeholder="¿Cuál es el nicho?"></textarea>
                </div>

                <div>
                    <label class="label">
                        Buyer Persona
                    </label>

                    <textarea
                        class="input min-h-[120px]"
                        id="buyer"
                        placeholder="Describe al cliente ideal"></textarea>
                </div>

            </div>

        </section>

        <section>

            <h2 class="section-title">
                Marketing
            </h2>

            <div class="space-y-5">

                <div>
                    <label class="label">
                        Propuesta de Valor
                    </label>

                    <textarea
                        class="input min-h-[100px]"
                        id="value"
                        placeholder="¿Qué ofrece la marca?"></textarea>
                </div>

                <div>
                    <label class="label">
                        Redes Sociales
                    </label>

                    <input
                        type="text"
                        class="input"
                        id="url"
                        placeholder="https://instagram.com/...">
                </div>

            </div>

        </section>

    </form>

</div>

<div
    id="reportModal"
    class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-4">

    <div
        class="bg-[#111315] border border-slate-800 w-full max-w-4xl rounded-3xl overflow-hidden">

        <div class="p-5 border-b border-slate-800 flex justify-between items-center">

            <div>

                <h2 class="text-2xl font-black">
                    Reporte Estratégico
                </h2>

                <p class="text-slate-400 text-sm mt-1">
                    Vista previa lista para enviar
                </p>

            </div>

            <button
                id="closeModal"
                class="btn-dark px-5">
                Cerrar
            </button>

        </div>

        <div
            id="reportContent"
            class="p-6 max-h-[75vh] overflow-y-auto space-y-5">
        </div>

        <div class="p-5 border-t border-slate-800">

            <button
                id="sendWhatsapp"
                class="btn-green w-full">
                Enviar por WhatsApp
            </button>

        </div>

    </div>

</div>

<script>

const PHONE_NUMBER = "59177173169";

const generateBtn = document.getElementById("generateBtn");
const reportModal = document.getElementById("reportModal");
const reportContent = document.getElementById("reportContent");
const closeModal = document.getElementById("closeModal");
const sendWhatsapp = document.getElementById("sendWhatsapp");

function getData(){

    return {

        name: document.getElementById("name").value || "No especificado",

        logo: document.getElementById("logo").value || "No especificado",

        colors: document.getElementById("colors").value || "No especificado",

        history: document.getElementById("history").value || "No especificado",

        emotions: document.getElementById("emotions").value || "No especificado",

        product: document.getElementById("product").value || "No especificado",

        attributes: document.getElementById("attributes").value || "No especificado",

        niche: document.getElementById("niche").value || "No especificado",

        buyer: document.getElementById("buyer").value || "No especificado",

        value: document.getElementById("value").value || "No especificado",

        url: document.getElementById("url").value || "No especificado"

    };

}

function createCard(title, text){

    return `

    <div class="report-card">

        <h3 class="report-title">
            ${title}
        </h3>

        <p class="text-slate-300 leading-7 whitespace-pre-wrap">
            ${text}
        </p>

    </div>

    `;

}

generateBtn.addEventListener("click", () => {

    const data = getData();

    reportContent.innerHTML = `

        ${createCard("Nombre Comercial", data.name)}

        ${createCard("Logotipo", data.logo)}

        ${createCard("Colores", data.colors)}

        ${createCard("Historia", data.history)}

        ${createCard("Emociones", data.emotions)}

        ${createCard("Productos", data.product)}

        ${createCard("Diferenciadores", data.attributes)}

        ${createCard("Nicho", data.niche)}

        ${createCard("Buyer Persona", data.buyer)}

        ${createCard("Propuesta de Valor", data.value)}

        ${createCard("Redes Sociales", data.url)}

    `;

    reportModal.classList.remove("hidden");

    reportModal.classList.add("flex");

});

closeModal.addEventListener("click", () => {

    reportModal.classList.remove("flex");

    reportModal.classList.add("hidden");

});

sendWhatsapp.addEventListener("click", () => {

    const data = getData();

    const message = `

*BRIEF CREATIVO*

*Marca:* ${data.name}

*Logotipo:* ${data.logo}

*Colores:* ${data.colors}

*Historia:* ${data.history}

*Emociones:* ${data.emotions}

*Productos:* ${data.product}

*Diferenciadores:* ${data.attributes}

*Nicho:* ${data.niche}

*Buyer Persona:* ${data.buyer}

*Propuesta de Valor:* ${data.value}

*Redes:* ${data.url}

`;

    const url = `https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(message)}`;

    window.open(url, "_blank");

});

</script>

</body>
</html>
