<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Catequistas</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-beige: #f7f5f0;
            --primary-green: #4da674;
            --light-green: #eef7f2;
            --accent-green: #3b875c;
            --dark-text: #2d3748;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-beige);
            color: var(--dark-text);
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        /* Contenedor Estilo App Móvil Nativa */
        .app-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Encabezado */
        header {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--accent-green) 100%);
            color: white;
            padding: 25px 20px;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 4px 12px rgba(77, 166, 116, 0.2);
        }

        header h1 {
            font-size: 22px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header p {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 4px;
            font-weight: 300;
        }

        /* Barra de búsqueda y herramientas */
        .app-bar {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            border: 2px solid transparent;
            background-color: var(--light-green);
            border-radius: 16px;
            font-size: 14px;
            color: var(--dark-text);
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
        }

        .search-box input:focus {
            border-color: var(--primary-green);
            background-color: #ffffff;
            box-shadow: 0 4px 12px rgba(77, 166, 116, 0.1);
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-green);
            font-size: 16px;
            transition: transform 0.3s ease;
        }

        .search-box input:focus + i {
            transform: translateY(-50%) scale(1.1);
        }

        .btn-pdf {
            background-color: var(--bg-beige);
            color: var(--accent-green);
            border: none;
            padding: 12px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-pdf:active {
            transform: scale(0.97);
            background-color: #ede9e0;
        }

        /* Lista y Tarjetas de Materiales */
        .inventory-list {
            padding: 0 20px 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            flex: 1;
        }

        .item-card {
            background: #ffffff;
            border: 1px solid #f0ede6;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.01);
            transition: all 0.3s ease;
            animation: cardLoad 0.4s ease-out both;
        }

        .item-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.04);
            border-color: var(--primary-green);
        }

        @keyframes cardLoad {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .item-name {
            font-size: 15px;
            font-weight: 600;
            color: #1a202c;
            line-height: 1.3;
        }

        .item-qty {
            background-color: var(--light-green);
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .item-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
            padding-top: 8px;
            border-top: 1px dashed #edf2f7;
        }

        .item-obs {
            font-size: 12px;
            color: #718096;
            font-weight: 400;
            max-width: 70%;
        }

        /* Estados de los Materiales */
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .badge-bueno { background-color: #def7ec; color: #03543f; }
        .badge-regular { background-color: #fef08a; color: #713f12; }
        .badge-malo { background-color: #fde8e8; color: #9b1c1c; }

        /* Estilos de Impresión Limpios para Reportes PDF */
        @media print {
            body { background: white; padding: 0; color: #000; }
            .app-container { max-width: 100%; width: 100%; box-shadow: none; border: none; }
            .app-bar { display: none !important; }
            header { background: none !important; color: black !important; padding: 10px 0; border-bottom: 2px solid #222; }
            header h1 { color: black !important; }
            header p { color: #555 !important; }
            .inventory-list { padding: 20px 0; gap: 0; }
            .item-card { 
                page-break-inside: avoid; 
                border: none !important;
                border-bottom: 1px solid #e2e8f0 !important; 
                border-radius: 0 !important; 
                padding: 10px 0 !important;
                flex-direction: row !important;
                justify-content: space-between;
            }
            .item-header { width: 60%; }
            .item-footer { border: none !important; margin: 0 !important; padding: 0 !important; width: 35%; justify-content: flex-end; gap: 15px; }
            .item-obs { max-width: 100%; font-size: 11px; }
            .badge { border: 1px solid #ccc !important; background: none !important; color: black !important; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1><i class="fa-solid fa-leaf"></i> Inventario Catequistas</h1>
        <p>Consulta global de materiales y herramientas integradas</p>
    </header>

    <div class="app-bar">
        <div class="search-box">
            <input type="text" id="searchInput" onkeyup="searchItems()" placeholder="Buscar producto, observación o estado...">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <button class="btn-pdf" onclick="window.print()">
            <i class="fa-solid fa-print"></i> Generar Reporte PDF
        </button>
    </div>

    <!-- Lista de Inventario Completa -->
    <div class="inventory-list" id="inventoryList">
        <!-- Cargado mediante JS -->
    </div>
</div>

<script>
    // BASE DE DATOS COMPLETA E INTEGRADA DEL SPREADSHEET
    const baseDeDatosInventario = [
        { producto: "Espadas de Madera", cantidad: 14, estado: "Bueno", observaciones: "Están en una caja mediana" },
        { producto: "Cascos dorados", cantidad: 25, estado: "Regular", observaciones: "Están sin su esponja y algunos necesitan reparación" },
        { producto: "Pecheras", cantidad: 39, estado: "Bueno", observaciones: "Ninguna" },
        { producto: "Coro", cantidad: 1, estado: "Malo", observaciones: "Cambiar o restaurar por completo" },
        { producto: "Capas guindas de soldados", cantidad: 38, estado: "Bueno", observaciones: "Capas en su mayoría en buen estado" },
        { producto: "Cartones de falda", cantidad: 51, estado: "Regular", observaciones: "Organizados en el depósito" },
        { producto: "Cucharas de fierro", cantidad: 32, estado: "Bueno", observaciones: "Limpias y resguardadas" },
        { producto: "Albas blancas", cantidad: 4, estado: "Bueno", observaciones: "Son 4 Albas blancas y una adicional en color cremita" },
        { producto: "Cruces de madera", cantidad: 12, estado: "Bueno", observaciones: "Guardadas en la caja principal de liturgia" },
        { producto: "Velones blancos grandes", cantidad: 8, estado: "Bueno", observaciones: "Caja de sacristía" },
        { producto: "Manteles litúrgicos", cantidad: 6, estado: "Regular", observaciones: "Dos necesitan costura y lavado" },
        { producto: "Rosarios de madera", cantidad: 45, estado: "Bueno", observaciones: "Bolsa de tela en el armario principal" },
        { producto: "Libros de cantos", cantidad: 20, estado: "Regular", observaciones: "Algunos tienen las hojas sueltas" },
        { producto: "Candelabros de metal", cantidad: 2, estado: "Bueno", observaciones: "Limpios en estante superior" },
        { producto: "Guías de catequesis (Nivel 1)", cantidad: 15, estado: "Bueno", observaciones: "Material de apoyo docente" },
        { producto: "Guías de catequesis (Nivel 2)", cantidad: 18, estado: "Bueno", observaciones: "Material de apoyo docente" },
        { producto: "Cáliz de metal decorativo", cantidad: 1, estado: "Bueno", observaciones: "Uso exclusivo para representaciones" },
        { producto: "Túnicas beige de niños", cantidad: 12, estado: "Bueno", observaciones: "Lavadas y colgadas en el ropero trasero" },
        { producto: "Estandartes de tela", cantidad: 5, estado: "Bueno", observaciones: "Con mástiles de madera desarmables" },
        { producto: "Cajas de sonido portátiles", cantidad: 2, estado: "Regular", observaciones: "Una tiene falso contacto en la entrada auxiliar" },
        { producto: "Micrófonos inalámbricos", cantidad: 4, estado: "Bueno", observaciones: "Revisar baterías antes de cada sesión" },
        { producto: "Extensiones de corriente (10m)", cantidad: 3, estado: "Bueno", observaciones: "Color negro, guardadas con cinta protectora" },
        { producto: "Proyector multimedia", cantidad: 1, estado: "Bueno", observaciones: "En su maletín con cables HDMI y de poder" },
        { producto: "Pizarras acrílicas portátiles", cantidad: 2, estado: "Bueno", observaciones: "Incluyen borradores magnéticos" }
    ];

    // Cargar y estructurar visualmente todas las tarjetas
    function inicializarInventario() {
        const container = document.getElementById("inventoryList");
        container.innerHTML = "";

        baseDeDatosInventario.forEach((item, index) => {
            const estadoClase = item.estado.toLowerCase().trim();
            let badgeClass = "badge-regular";
            
            if (estadoClase.includes("buen")) badgeClass = "badge-bueno";
            if (estadoClase.includes("mal")) badgeClass = "badge-malo";

            const card = document.createElement("div");
            card.className = "item-card";
            card.style.animationDelay = `${index * 0.04}s`; // Animación escalonada fluida

            card.innerHTML = `
                <div class="item-header">
                    <span class="item-name">${item.producto}</span>
                    <span class="item-qty">${item.cantidad} unidades</span>
                </div>
                <div class="item-footer">
                    <span class="item-obs">${item.observaciones}</span>
                    <span class="badge ${badgeClass}">${item.estado}</span>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Buscador interactivo en tiempo real multi-parámetro
    function searchItems() {
        const filter = document.getElementById("searchInput").value.toUpperCase();
        const list = document.getElementById("inventoryList");
        const cards = list.getElementsByClassName("item-card");

        for (let i = 0; i < cards.length; i++) {
            const name = cards[i].getElementsByClassName("item-name")[0].textContent;
            const obs = cards[i].getElementsByClassName("item-obs")[0].textContent;
            const badge = cards[i].getElementsByClassName("badge")[0].textContent;
            
            const matchText = `${name} ${obs} ${badge}`.toUpperCase();

            if (matchText.indexOf(filter) > -1) {
                cards[i].style.display = "";
            } else {
                cards[i].style.display = "none";
            }
        }
    }

    // Arrancar la base de datos inmediatamente al abrir la URL
    window.onload = inicializarInventario;
</script>

</body>
</html>
